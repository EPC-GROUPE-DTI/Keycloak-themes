<!DOCTYPE html>
<html class="gts-html" lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>EXPLORE login theme — preview</title>
<link rel="icon" href="themes/gts-theme/login/resources/img/favicon.svg">
<link rel="stylesheet" href="themes/gts-theme/login/resources/css/styles.css">
<style>
  /* Preview chrome only — not part of the theme. */
  .pv-bar {
    position: fixed;
    z-index: 100;
    right: 1rem;
    bottom: 1rem;
    display: flex;
    align-items: center;
    gap: .5rem;
    padding: .375rem;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--r-pill);
    box-shadow: var(--shadow-md);
    font: 500 .8125rem/1 var(--font);
    color: var(--ink);
  }
  .pv-bar select,
  .pv-bar button {
    font: inherit;
    color: inherit;
    background: transparent;
    border: 0;
    border-radius: var(--r-pill);
    padding: .5rem .75rem;
    cursor: pointer;
  }
  .pv-bar select { border: 1px solid var(--line); }
  .pv-bar button:hover { background: var(--surface-sunken); }
  @media (max-width: 30rem) { .pv-bar { left: 1rem; right: 1rem; justify-content: space-between; } }
</style>
</head>
<body class="gts-body">

<div class="gts-login">
  <div class="gts-bg" aria-hidden="true"><span></span><span></span><span></span></div>

  <div class="gts-stage">
    <div class="gts-brand-col">
        <svg class="gts-glass-art" viewBox="0 0 620 460" aria-hidden="true" focusable="false">
          <defs>
            <clipPath id="gts-rock-clip"><path d="M0 150H200V206H360V262H520V318H620V460H0Z"/></clipPath>
          </defs>
          <!-- the bench being worked -->
          <path class="gts-rock" d="M0 150H200V206H360V262H520V318H620V460H0Z"/>
          <path class="gts-bench" d="M0 150H200V206H360V262H520V318H620"/>
          <!-- 1. drilling — the rig tracks the row and each hole appears behind it -->
          <g class="gts-rig"><path d="M0 122V150" /><path d="M-7 150H7L0 162Z" /></g>
          <g class="gts-holes">
            <line class="gts-hole gts-hole--1" x1="40" y1="150" x2="40" y2="188" pathLength="1"/>
            <line class="gts-hole gts-hole--2" x1="76" y1="150" x2="76" y2="188" pathLength="1"/>
            <line class="gts-hole gts-hole--3" x1="112" y1="150" x2="112" y2="188" pathLength="1"/>
            <line class="gts-hole gts-hole--4" x1="148" y1="150" x2="148" y2="188" pathLength="1"/>
            <line class="gts-hole gts-hole--5" x1="184" y1="150" x2="184" y2="188" pathLength="1"/>
          </g>
          <!-- 2. loading — each hole charges from the toe up -->
          <g class="gts-charges">
            <line class="gts-charge gts-charge--1" x1="40" y1="188" x2="40" y2="158" pathLength="1"/>
            <line class="gts-charge gts-charge--2" x1="76" y1="188" x2="76" y2="158" pathLength="1"/>
            <line class="gts-charge gts-charge--3" x1="112" y1="188" x2="112" y2="158" pathLength="1"/>
            <line class="gts-charge gts-charge--4" x1="148" y1="188" x2="148" y2="158" pathLength="1"/>
            <line class="gts-charge gts-charge--5" x1="184" y1="188" x2="184" y2="158" pathLength="1"/>
          </g>
          <!-- 3. firing — collars flash on the delay sequence -->
          <g class="gts-fires">
            <circle class="gts-fire gts-fire--1" cx="40" cy="150" r="8"/>
            <circle class="gts-fire gts-fire--2" cx="76" cy="150" r="8"/>
            <circle class="gts-fire gts-fire--3" cx="112" cy="150" r="8"/>
            <circle class="gts-fire gts-fire--4" cx="148" cy="150" r="8"/>
            <circle class="gts-fire gts-fire--5" cx="184" cy="150" r="8"/>
          </g>
          <!-- 4. the wavefront, travelling through rock -->
          <g clip-path="url(#gts-rock-clip)">
            <circle class="gts-wave gts-wave--1" cx="112" cy="168" r="140"/>
            <circle class="gts-wave gts-wave--2" cx="112" cy="168" r="140"/>
            <circle class="gts-wave gts-wave--3" cx="112" cy="168" r="140"/>
          </g>
          <!-- 5. monitors on the benches trip in order of distance -->
          <g class="gts-sensors">
            <line class="gts-mast" x1="300" y1="206" x2="300" y2="186"/>
            <circle class="gts-ping gts-ping--1" cx="300" cy="184" r="10"/>
            <circle class="gts-sensor gts-sensor--1" cx="300" cy="184" r="4.5"/>
            <line class="gts-mast" x1="430" y1="262" x2="430" y2="242"/>
            <circle class="gts-ping gts-ping--2" cx="430" cy="240" r="10"/>
            <circle class="gts-sensor gts-sensor--2" cx="430" cy="240" r="4.5"/>
            <line class="gts-mast" x1="560" y1="318" x2="560" y2="298"/>
            <circle class="gts-ping gts-ping--3" cx="560" cy="296" r="10"/>
            <circle class="gts-sensor gts-sensor--3" cx="560" cy="296" r="4.5"/>
          </g>
          <!-- 6. the record, always running -->
          <g class="gts-tape">
            <line class="gts-baseline" x1="0" y1="404" x2="620" y2="404"/>
            <g class="gts-scroll">
              <path class="gts-trace" transform="translate(0 404)" d="M0 -0.2 L10 0.2 L20 1.7 L30 -0.1 L40 0.0 L50 0.3 L60 -1.3 L70 0.0 L80 0.5 L90 1.2 L100 -1.6 L110 -0.8 L120 -1.6 L130 1.2 L140 0.8 L150 -1.8 L160 1.9 L170 1.9 L180 0.6 L190 0.5 L200 -1.4 L210 -1.9 L220 0.1 L230 -1.8 L240 -1.2 L250 17.1 L260 -12.1 L270 13.4 L280 -10.9 L290 11.2 L300 -7.8 L310 6.9 L320 -5.2 L330 4.7 L340 -3.5 L350 2.6 L360 -3.1 L370 2.6 L380 -2.0 L390 1.5 L400 -1.0 L410 -1.1 L420 -0.8 L430 -1.7 L440 1.1 L450 -0.4 L460 1.4 L470 -0.5 L480 1.8 L490 1.4 L500 -2.0 L510 -1.2 L520 1.6 L530 -0.1 L540 1.9 L550 -0.4 L560 -1.7 L570 0.5 L580 1.1 L590 -0.9 L600 -1.7 L610 -0.7 L620 1.9"/>
              <path class="gts-trace" transform="translate(620 404)" d="M0 -0.2 L10 0.2 L20 1.7 L30 -0.1 L40 0.0 L50 0.3 L60 -1.3 L70 0.0 L80 0.5 L90 1.2 L100 -1.6 L110 -0.8 L120 -1.6 L130 1.2 L140 0.8 L150 -1.8 L160 1.9 L170 1.9 L180 0.6 L190 0.5 L200 -1.4 L210 -1.9 L220 0.1 L230 -1.8 L240 -1.2 L250 17.1 L260 -12.1 L270 13.4 L280 -10.9 L290 11.2 L300 -7.8 L310 6.9 L320 -5.2 L330 4.7 L340 -3.5 L350 2.6 L360 -3.1 L370 2.6 L380 -2.0 L390 1.5 L400 -1.0 L410 -1.1 L420 -0.8 L430 -1.7 L440 1.1 L450 -0.4 L460 1.4 L470 -0.5 L480 1.8 L490 1.4 L500 -2.0 L510 -1.2 L520 1.6 L530 -0.1 L540 1.9 L550 -0.4 L560 -1.7 L570 0.5 L580 1.1 L590 -0.9 L600 -1.7 L610 -0.7 L620 1.9"/>
            </g>
          </g>
        </svg>
      <div id="kc-header" class="gts-header">
        <div id="kc-header-wrapper" class="gts-brand">
          <img class="gts-logo" src="themes/gts-theme/login/resources/img/logo.svg" alt="EXPLORE" width="331" height="71">
        </div>
      </div>
      <p class="gts-aside-line" data-i18n="brandTagline">Blast monitoring and reporting</p>
      <p class="gts-aside-note" data-i18n="brandNote">Having trouble? Your workspace administrator can help.</p>
    </div>

    <main class="gts-card">
      <div class="gts-card-inner" id="pv-panel"><!-- filled from templates below --></div>
    </main>
  </div>
</div>

<div class="pv-bar">
  <select id="pv-page" aria-label="Preview page"></select>
  <button id="pv-theme" type="button">Dark</button>
</div>

<!-- ------------------------------------------------------------------ -->
<!-- Page bodies. Markup mirrors the .ftl templates one-for-one.          -->
<!-- ------------------------------------------------------------------ -->
<template data-page="Sign in">
  <div class="gts-locale" id="kc-locale">
    <div id="kc-locale-wrapper" class="gts-locale-wrap">
      <div id="kc-locale-dropdown" class="menu-button-links gts-locale-dropdown">
        <button id="kc-current-locale-link" aria-haspopup="true" aria-expanded="false" aria-controls="language-switch1">English</button>
        <ul role="menu" tabindex="-1" id="language-switch1" class="gts-locale-list">
          <li class="gts-locale-item" role="none"><a role="menuitem" class="gts-locale-link" href="#" data-lang="en">English</a></li>
          <li class="gts-locale-item" role="none"><a role="menuitem" class="gts-locale-link" href="#" data-lang="fr">Français</a></li>
          <li class="gts-locale-item" role="none"><a role="menuitem" class="gts-locale-link" href="#" data-lang="es">Español</a></li>
        </ul>
      </div>
    </div>
  </div>
  <header class="gts-form-header">
    <h1 class="gts-title" data-i18n="loginAccountTitle">Sign in</h1>
    <p class="gts-subtitle" data-i18n="loginAccountSubtitle">Enter your email and password to continue.</p>
  </header>
  <div id="kc-content" class="gts-content"><div id="kc-content-wrapper">
    <form class="gts-form" data-pending-form onsubmit="return false">
      <div class="gts-field">
        <label for="username" class="gts-label" data-i18n="username">Email</label>
        <input id="username" name="username" type="text" class="gts-input" inputmode="email" autocapitalize="none" spellcheck="false" placeholder="you@company.com">
      </div>
      <div class="gts-field">
        <div class="gts-label-row">
          <label for="password" class="gts-label" data-i18n="password">Password</label>
          <a class="gts-label-link" href="#" data-i18n="doForgotPassword">Forgot password?</a>
        </div>
        <div class="gts-input-group">
          <input type="password" id="password" name="password" class="gts-input" autocomplete="current-password" data-caps-lock aria-describedby="password-caps" value="hunter2hunter2">
          <button type="button" hidden data-reveal class="gts-reveal" aria-controls="password" aria-label="Show password" data-i18n-reveal data-label-show="Show password" data-label-hide="Hide password"><span class="gts-icon-eye" aria-hidden="true"></span></button>
        </div>
        <p class="gts-caps" id="password-caps" data-visible="false" aria-live="polite" data-i18n="capsLockOn">Caps Lock is on</p>
      </div>
      <div class="gts-options">
        <label class="gts-check"><input type="checkbox" checked><span data-i18n="rememberMe">Keep me signed in</span></label>
      </div>
      <div class="gts-actions">
        <input type="submit" class="gts-btn gts-btn-primary gts-btn-block gts-btn-lg" value="Sign in" data-i18n-value="loginAccountTitle" data-idle-label="Sign in" data-i18n-pending="pendingSignIn" data-pending-label="Signing in...">
      </div>
    </form>
  </div></div>
  <footer class="gts-footer"><img class="gts-corp" src="themes/gts-theme/login/resources/img/gts.png" width="241" height="63" alt="Global Technical Solutions"><p class="gts-footer-meta"><span>&copy; 2026 EXPLORE</span><span class="gts-version">V.01.34</span></p></footer>
</template>

<script src="themes/gts-theme/login/resources/js/script.js"></script>
<script>
  // Preview chrome. None of this ships with the theme.
  var panel = document.getElementById("pv-panel");
  var select = document.getElementById("pv-page");
  var themeBtn = document.getElementById("pv-theme");
  var aside = document.querySelector(".gts-brand-col");
  var pages = Array.prototype.slice.call(document.querySelectorAll("template[data-page]"));

  pages.forEach(function (tpl, i) {
    var opt = document.createElement("option");
    opt.value = String(i);
    opt.textContent = tpl.dataset.page;
    select.appendChild(opt);
  });

  function replayArt() {
    if (!aside) return;
    aside.querySelectorAll(".gts-art *").forEach(function (el) {
      el.style.animation = "none";
      void el.getBoundingClientRect();
      el.style.animation = "";
    });
  }

  function show(index) {
    panel.replaceChildren(pages[index].content.cloneNode(true));
    // re-run the theme's own enhancement on the freshly injected markup
    document.dispatchEvent(new Event("DOMContentLoaded"));
    applyLang(lang);
    replayArt();
    localStorage.setItem("pv-page", String(index));
  }

  select.addEventListener("change", function () { show(Number(select.value)); });

  // Forms are inert here, so release the pending button after a beat.
  document.addEventListener("submit", function () {
    setTimeout(function () { window.dispatchEvent(new PageTransitionEvent("pageshow", { persisted: true })); }, 1400);
  }, true);

  // --- Translations ------------------------------------------------------
  // On the real pages Keycloak resolves every string from the bundles; here we
  // read the same bundles so the switcher shows the wording that ships.
  var I18N = JSON.parse(document.getElementById("pv-i18n").textContent || "{}");
  var LANG_LABEL = { en: "English", fr: "Français", es: "Español" };
  var lang = "en";

  function translate(key, fallback) {
    var table = I18N[lang] || {};
    return table[key] || (I18N.en || {})[key] || fallback;
  }

  function applyLang(next) {
    if (!I18N[next]) return;
    lang = next;
    document.documentElement.setAttribute("lang", lang);

    document.querySelectorAll("[data-i18n]").forEach(function (el) {
      el.textContent = translate(el.dataset.i18n, el.textContent).replace("{0}", "ada@explore.io");
    });
    document.querySelectorAll("[data-i18n-value]").forEach(function (el) {
      var text = translate(el.dataset.i18nValue, el.value);
      el.value = text;
      el.dataset.idleLabel = text;
    });
    document.querySelectorAll("[data-i18n-pending]").forEach(function (el) {
      el.dataset.pendingLabel = translate(el.dataset.i18nPending, el.dataset.pendingLabel);
    });
    document.querySelectorAll("[data-i18n-reveal]").forEach(function (el) {
      el.dataset.labelShow = translate("showPassword", el.dataset.labelShow);
      el.dataset.labelHide = translate("hidePassword", el.dataset.labelHide);
      el.setAttribute("aria-label", el.getAttribute("aria-pressed") === "true"
        ? el.dataset.labelHide : el.dataset.labelShow);
    });

    var current = document.getElementById("kc-current-locale-link");
    if (current) current.textContent = LANG_LABEL[lang];
    localStorage.setItem("pv-lang", lang);
  }

  // Locale menu: the real pages use Keycloak's menu-button-links.js.
  document.addEventListener("click", function (event) {
    var choice = event.target.closest("[data-lang]");
    if (choice) {
      event.preventDefault();
      applyLang(choice.dataset.lang);
    }

    var button = event.target.closest("#kc-current-locale-link");
    var list = document.getElementById("language-switch1");
    if (!list) return;
    if (button) {
      var open = button.getAttribute("aria-expanded") === "true";
      button.setAttribute("aria-expanded", String(!open));
      list.style.display = open ? "" : "block";
      event.stopPropagation();
      return;
    }
    var current = document.getElementById("kc-current-locale-link");
    if (current) current.setAttribute("aria-expanded", "false");
    list.style.display = "";
  });

  function applyTheme(theme) {
    document.documentElement.dataset.theme = theme;
    themeBtn.textContent = theme === "dark" ? "Light" : "Dark";
    localStorage.setItem("pv-theme", theme);
  }

  themeBtn.addEventListener("click", function () {
    applyTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark");
  });

  // ?theme=dark, ?page=3 and ?lang=fr make single states easy to link or screenshot.
  var params = new URLSearchParams(location.search);
  var savedTheme = params.get("theme") || localStorage.getItem("pv-theme");
  applyTheme(savedTheme === "dark" || savedTheme === "light" ? savedTheme
    : (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"));
  lang = params.get("lang") || localStorage.getItem("pv-lang") || "en";
  if (!I18N[lang]) lang = "en";
  var savedPage = Number(params.get("page") || localStorage.getItem("pv-page") || 0);
  select.value = String(savedPage >= 0 && savedPage < pages.length ? savedPage : 0);
  show(Number(select.value));
</script>
