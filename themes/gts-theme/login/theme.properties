# =============================================================================
# EXPLORE — Keycloak login theme (26.x)
# Split layout: CSS art panel + form column. No bitmap assets, auto light/dark.
# =============================================================================

parent=base
import=common/keycloak

# Declared empty on purpose. Without this, newer Keycloak versions inherit
# stylesCommon from the parent chain and inject ~1.8 MB of PatternFly CSS
# before ours, which overrides parts of this theme. Nothing here uses PatternFly.
stylesCommon=

styles=css/styles.css
scripts=js/script.js
locales=en,fr,es

appVersion=V.01.34

# Colour scheme: auto follows the visitor's OS setting; light or dark pins it.
colorScheme=auto
meta=viewport==width=device-width,initial-scale=1,viewport-fit=cover

## Page shell
kcHtmlClass=gts-html
kcBodyClass=gts-body
kcLoginClass=gts-login
kcHeaderClass=gts-header
kcHeaderWrapperClass=gts-brand
kcFormCardClass=gts-card
kcFormHeaderClass=gts-form-header
kcContentWrapperClass=gts-content
kcFormAreaClass=gts-form-area
kcFormClass=gts-form

## Fields
kcFormGroupClass=gts-field
kcFormGroupErrorClass=gts-field-invalid
kcLabelClass=gts-label
kcLabelWrapperClass=gts-label-wrap
kcInputClass=gts-input
kcInputLargeClass=gts-input
kcInputWrapperClass=gts-input-wrap
kcInputGroup=gts-input-group
kcInputErrorMessageClass=gts-field-error
kcInputHelperTextBeforeClass=gts-field-help
kcInputHelperTextAfterClass=gts-field-help
kcCheckboxInputClass=gts-checkbox-input
kcRadioInputClass=gts-radio-input
kcSelectClass=gts-input

## Layout blocks
kcFormOptionsClass=gts-options
kcFormOptionsWrapperClass=gts-options-wrap
kcFormButtonsClass=gts-actions
kcFormSettingClass=gts-settings
kcSignUpClass=gts-signup
kcInfoAreaWrapperClass=gts-info-area

## Buttons
kcButtonClass=gts-btn
kcButtonPrimaryClass=gts-btn-primary
kcButtonDefaultClass=gts-btn-ghost
kcButtonLargeClass=gts-btn-lg
kcButtonBlockClass=gts-btn-block

## Password visibility
kcFormPasswordVisibilityButtonClass=gts-reveal
kcFormPasswordVisibilityIconShow=gts-icon-eye
kcFormPasswordVisibilityIconHide=gts-icon-eye-off

## Alerts
kcAlertClass=gts-alert
kcAlertTitleClass=gts-alert-text
kcFeedbackErrorIcon=gts-alert-icon
kcFeedbackWarningIcon=gts-alert-icon
kcFeedbackSuccessIcon=gts-alert-icon
kcFeedbackInfoIcon=gts-alert-icon

## Locale switcher
kcLocaleMainClass=gts-locale
kcLocaleWrapperClass=gts-locale-wrap
kcLocaleDropDownClass=gts-locale-dropdown
kcLocaleListClass=gts-locale-list
kcLocaleListItemClass=gts-locale-item
kcLocaleItemClass=gts-locale-link

## Authenticator picker ("Try another way")
kcSelectAuthListClass=gts-auth-list
kcSelectAuthListItemClass=gts-auth-item
kcSelectAuthListItemIconClass=gts-auth-icon
kcSelectAuthListItemIconPropertyClass=gts-auth-icon-glyph
kcSelectAuthListItemBodyClass=gts-auth-body
kcSelectAuthListItemHeadingClass=gts-auth-heading
kcSelectAuthListItemDescriptionClass=gts-auth-desc
kcSelectAuthListItemFillClass=gts-auth-fill
kcSelectAuthListItemArrowClass=gts-auth-arrow
kcSelectAuthListItemArrowIconClass=gts-auth-arrow-icon
kcSelectAuthListItemTitle=gts-auth-title
